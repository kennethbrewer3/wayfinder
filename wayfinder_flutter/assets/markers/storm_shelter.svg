<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Storm shelter icon">

  <!-- Earthen mound -->
  <path d="M4 40
           C8 27 15 18 24 16
           C33 18 40 27 44 40Z"
        fill="#6B7A46"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Reinforced shelter entrance -->
  <path d="M13 40
           V29
           C13 23 17 20 24 20
           C31 20 35 23 35 29
           V40Z"
        fill="#78909C"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Steel storm door -->
  <rect x="18" y="27" width="12" height="13" rx="1"
        fill="#455A64"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Door reinforcement -->
  <path d="M21 27v13
           M27 27v13
           M18 33.5h12"
        stroke="#90A4AE"
        stroke-width="1.5"/>

  <!-- Door handle -->
  <circle cx="27" cy="35" r="1.2"
          fill="#FFD43B"
          stroke="#202020"
          stroke-width="1"/>

  <!-- Storm warning symbol -->
  <circle cx="24" cy="16" r="7"
          fill="#FFD43B"
          stroke="#202020"
          stroke-width="2"/>

  <path d="M27 10
           L21 17
           H25
           L21 23
           L30 15
           H26Z"
        fill="#202020"
        stroke="#202020"
        stroke-width="1"
        stroke-linejoin="round"/>

  <!-- Wind lines -->
  <path d="M5 11h8
           C16 11 16 7 13 7
           M37 11h6
           C46 11 46 7 43 7"
        fill="none"
        stroke="#64B5F6"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Ground -->
  <path d="M4 42h40"
        stroke="#4CAF50"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

# Wayfinder routing server — pull pre-built image from GitHub Container Registry.
#
# Quick start (no git clone):
#   mkdir wayfinder-routing-server && cd wayfinder-routing-server
#   curl -fsSLO https://raw.githubusercontent.com/kennethbrewer3/wayfinder/main/deploy/routing-server/docker-compose.yaml
#   curl -fsSLO https://raw.githubusercontent.com/kennethbrewer3/wayfinder/main/deploy/routing-server/.env.example
#   cp .env.example .env
#   docker compose pull
#   docker compose up -d --force-recreate
#   curl -sS http://127.0.0.1:18382/api/health
#   # Expect buildSha to match the latest commit on main (not "unknown")

name: wayfinder-routing-server

services:
  server:
    image: ${WAYFINDER_ROUTING_SERVER_IMAGE:-ghcr.io/kennethbrewer3/wayfinder-routing-server:latest}
    container_name: wayfinder-routing-server
    pull_policy: always
    ports:
      - "${WAYFINDER_ROUTING_SERVER_PORT:-18382}:18382"
    environment:
      PORT: "18382"
      DATA_DIR: /data
      JAVA_XMX: "${JAVA_XMX:-2g}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      GRAPHHOPPER_URL: http://127.0.0.1:8989
      GRAPHHOPPER_JAR: /app/graphhopper-web.jar
      GRAPHHOPPER_CONFIG: /app/config/config.yml
    volumes:
      - ${WAYFINDER_ROUTING_DATA_PATH:-./storage/data}:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:18382/api/health >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

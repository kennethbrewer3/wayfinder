<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Big rig truck icon">

  <!-- Trailer -->
  <rect x="4" y="14" width="25" height="20" rx="2"
        fill="#ECEFF1"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Trailer stripe -->
  <path d="M7 21h19"
        stroke="#1E88E5"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Truck cab -->
  <path d="M29 20h8l6 7v7H29z"
        fill="#D62828"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Cab roof -->
  <path d="M31 16h6l4 4H29z"
        fill="#B71C1C"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Windshield -->
  <path d="M34 20h3l4 5h-7z"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Side window -->
  <rect x="30" y="21" width="3" height="5"
        fill="#BBDEFB"
        stroke="#202020"
        stroke-width="1.2"/>

  <!-- Grille -->
  <rect x="39" y="28" width="4" height="5" rx="1"
        fill="#607D8B"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Headlight -->
  <circle cx="42" cy="27" r="1.5"
          fill="#FFD43B"
          stroke="#202020"
          stroke-width="1"/>

  <!-- Fuel tank -->
  <rect x="28" y="31" width="7" height="4" rx="1"
        fill="#90A4AE"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Wheels -->
  <circle cx="11" cy="36" r="5"
          fill="#263238"
          stroke="#202020"
          stroke-width="2"/>

  <circle cx="24" cy="36" r="5"
          fill="#263238"
          stroke="#202020"
          stroke-width="2"/>

  <circle cx="37" cy="36" r="5"
          fill="#263238"
          stroke="#202020"
          stroke-width="2"/>

  <circle cx="11" cy="36" r="2" fill="#90A4AE"/>
  <circle cx="24" cy="36" r="2" fill="#90A4AE"/>
  <circle cx="37" cy="36" r="2" fill="#90A4AE"/>

  <!-- Road -->
  <path d="M4 42h40"
        stroke="#607D8B"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

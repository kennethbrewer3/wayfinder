        stroke="#202020"
        stroke-width="2"/>

  <!-- Flood water -->
  <path d="M3 38 C8 34 12 36 16 34 C20 32 24 36 28 34 C32 32 36 36 40 34 C42 33 44 35 45 36 V42 H3 Z"

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Lookout tower icon">

  <!-- Tower cabin -->
  <rect x="12" y="9" width="24" height="15" rx="2"
        fill="#C98A50"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Cabin windows -->
  <rect x="15" y="12" width="7" height="7"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="1.5"/>

  <rect x="26" y="12" width="7" height="7"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Roof -->
  <path d="M9 9L24 4L39 9Z"
        fill="#5D4037"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Support legs -->
  <path d="M16 24L10 43
           M32 24L38 43"
        fill="none"
        stroke="#8D5A2B"
        stroke-width="4"
        stroke-linecap="round"/>

  <!-- Cross braces -->
  <path d="M15 29L35 41
           M33 29L13 41"
        fill="none"
        stroke="#5C3618"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Platform -->
  <path d="M9 24H39"
        stroke="#202020"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Ladder -->
  <path d="M22 24V43
           M27 24V43
           M22 29H27
           M22 34H27
           M22 39H27"
        fill="none"
        stroke="#607D8B"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Ground -->
  <path d="M6 44H42"
        stroke="#4CAF50"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Medical cache icon">

  <!-- Medical supply case -->
  <rect x="7" y="15" width="34" height="27" rx="3"
        fill="#F5F5F5"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Case lid -->
  <rect x="7" y="15" width="34" height="8" rx="3"
        fill="#D62828"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Handle -->
  <path d="M18 15v-4h12v4"
        fill="none"
        stroke="#202020"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Medical cross -->
  <rect x="21" y="25" width="6" height="13"
        fill="#D62828"/>

  <rect x="17.5" y="28.5" width="13" height="6"
        fill="#D62828"/>

  <!-- Latches -->
  <rect x="11" y="20" width="5" height="4" rx="1"
        fill="#607D8B"
        stroke="#202020"
        stroke-width="1.5"/>

  <rect x="32" y="20" width="5" height="4" rx="1"
        fill="#607D8B"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Supply markings -->
  <circle cx="13" cy="33" r="2"
          fill="#1E88E5"
          stroke="#202020"
          stroke-width="1.2"/>

  <circle cx="35" cy="33" r="2"
          fill="#FFD43B"
          stroke="#202020"
          stroke-width="1.2"/>
</svg>

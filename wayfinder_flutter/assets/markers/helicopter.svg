<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Helicopter icon">

  <!-- Main rotor -->
  <path d="M10 8h28"
        stroke="#202020"
        stroke-width="3"
        stroke-linecap="round"/>

  <path d="M24 8v6"
        stroke="#202020"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <!-- Helicopter body -->
  <path d="M12 29
           C12 20 18 14 27 14
           C34 14 39 18 39 24
           C39 30 34 34 27 34
           H18
           C14 34 12 32 12 29Z"
        fill="#E53935"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Cockpit -->
  <path d="M27 17
           C33 17 36 20 36 24
           H27Z"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="1.8"
        stroke-linejoin="round"/>

  <!-- Tail boom -->
  <path d="M12 24L4 20v8l8 1"
        fill="#C62828"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Tail rotor -->
  <circle cx="5" cy="24" r="4"
          fill="#ECEFF1"
          stroke="#202020"
          stroke-width="1.8"/>

  <path d="M5 20v8M1 24h8"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Landing skids -->
  <path d="M17 34v4M31 34v4M13 40h22"
        fill="none"
        stroke="#202020"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Side window -->
  <rect x="18" y="18" width="7" height="7" rx="2"
        fill="#BBDEFB"
        stroke="#202020"
        stroke-width="1.5"/>
</svg>

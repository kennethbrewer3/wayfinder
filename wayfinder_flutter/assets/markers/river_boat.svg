<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="River paddle boat icon">

  <!-- Hull -->
  <path d="M6 31h31l5 5-5 6H12z"
        fill="#D62828"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Main cabin -->
  <rect x="12" y="18" width="22" height="13" rx="1"
        fill="#F5F5F5"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Upper deck -->
  <rect x="17" y="10" width="14" height="8" rx="1"
        fill="#FFF3E0"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Windows -->
  <rect x="15" y="21" width="5" height="5"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="1.3"/>

  <rect x="22" y="21" width="5" height="5"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="1.3"/>

  <rect x="29" y="21" width="3" height="5"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="1.3"/>

  <!-- Smokestacks -->
  <rect x="19" y="5" width="3" height="5"
        fill="#455A64"
        stroke="#202020"
        stroke-width="1.5"/>

  <rect x="27" y="5" width="3" height="5"
        fill="#455A64"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Paddle wheel -->
  <circle cx="10" cy="33" r="7"
          fill="#A66A2C"
          stroke="#202020"
          stroke-width="2"/>

  <circle cx="10" cy="33" r="2"
          fill="#6D4C41"/>

  <path d="M10 26v14M3 33h14M5 28l10 10M15 28L5 38"
        stroke="#6D4C41"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Water -->
  <path d="M4 43c4-3 8 3 12 0s8 3 12 0 8 3 16 0"
        fill="none"
        stroke="#1E88E5"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

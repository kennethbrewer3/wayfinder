<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Power plant icon">

  <!-- Main plant building -->
  <rect x="7" y="22" width="28" height="19" rx="2"
        fill="#78909C"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Factory roof -->
  <path d="M7 22L15 16L21 22L29 16L35 22Z"
        fill="#607D8B"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Chimney -->
  <rect x="32" y="9" width="8" height="24" rx="1"
        fill="#B0BEC5"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Chimney band -->
  <path d="M32 16h8"
        stroke="#D62828"
        stroke-width="3"/>

  <!-- Generator windows -->
  <rect x="11" y="27" width="7" height="6" rx="1"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="1.5"/>

  <rect x="22" y="27" width="7" height="6" rx="1"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Power symbol -->
  <circle cx="21" cy="37" r="5"
          fill="#FFD43B"
          stroke="#202020"
          stroke-width="1.5"/>

  <path d="M23 33L19 38H22L20 42L25 36H22Z"
        fill="#202020"
        stroke="#202020"
        stroke-width="0.8"
        stroke-linejoin="round"/>

  <!-- Smoke -->
  <circle cx="36" cy="6" r="3"
          fill="#CFD8DC"
          stroke="#202020"
          stroke-width="1.5"/>

  <circle cx="40" cy="4" r="2.5"
          fill="#ECEFF1"
          stroke="#202020"
          stroke-width="1.5"/>

  <!-- Ground -->
  <path d="M5 43h38"
        stroke="#4CAF50"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Recreational vehicle icon">

  <!-- RV body -->
  <path d="M6 13
           H34
           C39 13 42 17 42 22
           V36
           H6Z"
        fill="#F5F5F5"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Front cab -->
  <path d="M32 17
           H36
           C38 17 40 19 40 22
           V27
           H32Z"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Side window -->
  <rect x="11" y="18" width="9" height="8" rx="1"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Door -->
  <rect x="22" y="20" width="8" height="16" rx="1"
        fill="#D7CCC8"
        stroke="#202020"
        stroke-width="2"/>

  <circle cx="28" cy="28" r="1"
          fill="#202020"/>

  <!-- Accent stripe -->
  <path d="M7 29
           C15 26 24 26 33 29
           C36 30 38 30 41 29"
        fill="none"
        stroke="#1E88E5"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Headlight and bumper -->
  <rect x="39" y="30" width="3" height="3" rx="1"
        fill="#FFD43B"
        stroke="#202020"
        stroke-width="1"/>

  <path d="M37 36h6"
        stroke="#607D8B"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Wheels -->
  <circle cx="14" cy="37" r="5"
          fill="#263238"
          stroke="#202020"
          stroke-width="2"/>

  <circle cx="35" cy="37" r="5"
          fill="#263238"
          stroke="#202020"
          stroke-width="2"/>

  <circle cx="14" cy="37" r="2"
          fill="#90A4AE"/>

  <circle cx="35" cy="37" r="2"
          fill="#90A4AE"/>

</svg>

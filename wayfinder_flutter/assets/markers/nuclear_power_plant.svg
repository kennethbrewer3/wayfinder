        fill="#202020"/>

  <path d="M22 34
           L19.2 38.8
           A6.3 6.3 0 0 1 16.4 34
           Z"
        fill="#202020"/>

  <!-- Steam -->
  <path d="M12 8c-3-3-1-6 1-7
           M17 8c-3-3-1-6 1-7
           M31 8c-3-3-1-6 1-7
           M36 8c-3-3-1-6 1-7"
        fill="none"
        stroke="#90A4AE"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Ground -->
  <path d="M5 42h38"

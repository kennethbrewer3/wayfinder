<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Septic tank icon">

  <!-- Ground line -->
  <path d="M4 28h40"
        stroke="#4CAF50"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Underground tank -->
  <ellipse cx="24" cy="34" rx="16" ry="8"
           fill="#78909C"
           stroke="#202020"
           stroke-width="2"/>

  <rect x="8" y="28" width="32" height="12" rx="2"
        fill="#90A4AE"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Access lid -->
  <rect x="18" y="24" width="12" height="4" rx="1"
        fill="#607D8B"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Inlet pipe -->
  <path d="M10 18h8v10"
        fill="none"
        stroke="#546E7A"
        stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Outlet / leach pipe -->
  <path d="M30 22h10v6"
        fill="none"
        stroke="#546E7A"
        stroke-width="3"
        stroke-linejoin="round"/>

  <!-- House hint -->
  <path d="M6 18L12 12l6 6"
        fill="#ECEFF1"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Warning hatch -->
  <circle cx="24" cy="26" r="2"
          fill="#FFD43B"
          stroke="#202020"
          stroke-width="1"/>
</svg>

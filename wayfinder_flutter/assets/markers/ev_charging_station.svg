<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="EV charging station icon">

  <!-- Charger post -->
  <rect x="16" y="10" width="16" height="28" rx="2"
        fill="#E3F2FD"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Display -->
  <rect x="19" y="13" width="10" height="8" rx="1"
        fill="#B3E5FC"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Lightning bolt -->
  <path d="M24 15
           L21 22h4l-2 7
           6-9h-4l2-5z"
        fill="#FFD43B"
        stroke="#202020"
        stroke-width="1.2"
        stroke-linejoin="round"/>

  <!-- Cable -->
  <path d="M32 24
           C38 24 40 28 40 32
           C40 36 38 38 34 38"
        fill="none"
        stroke="#202020"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <!-- Plug head -->
  <rect x="30" y="36" width="8" height="5" rx="1"
        fill="#607D8B"
        stroke="#202020"
        stroke-width="1.5"/>

  <circle cx="32" cy="38.5" r="1" fill="#202020"/>
  <circle cx="36" cy="38.5" r="1" fill="#202020"/>

  <!-- EV symbol on base -->
  <rect x="12" y="38" width="24" height="4" rx="1"
        fill="#4CAF50"
        stroke="#202020"
        stroke-width="1.2"/>

  <!-- Car silhouette -->
  <path d="M10 30
           C10 28 12 27 14 27
           H30
           C33 27 35 28 36 30
           L38 34
           H8Z"
        fill="#1565C0"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <circle cx="14" cy="34" r="2" fill="#37474F" stroke="#202020" stroke-width="1"/>
  <circle cx="32" cy="34" r="2" fill="#37474F" stroke="#202020" stroke-width="1"/>
</svg>

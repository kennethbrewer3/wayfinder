<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Pedestrian crossing icon">

  <!-- Crossing sign -->
  <path d="M24 4L44 24L24 44L4 24Z"
        fill="#FFD43B"
        stroke="#202020"
        stroke-width="2.5"
        stroke-linejoin="round"/>

  <!-- Head -->
  <circle cx="25" cy="14" r="3"
          fill="#202020"/>

  <!-- Body and arms -->
  <path d="M24 18L21 27
           M23 21L17 25
           M23 21L29 25"
        fill="none"
        stroke="#202020"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Walking legs -->
  <path d="M21 27L16 35
           M21 27L29 34"
        fill="none"
        stroke="#202020"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Crosswalk stripes -->
  <path d="M12 38h5M20 38h5M28 38h5"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

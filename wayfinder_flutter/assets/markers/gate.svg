  <circle cx="12" cy="34" r="1.5" fill="#202020"/>
  <circle cx="36" cy="21" r="1.5" fill="#202020"/>
  <circle cx="36" cy="34" r="1.5" fill="#202020"/>

  <!-- Latch -->

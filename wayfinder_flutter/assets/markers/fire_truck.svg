<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Side view fire truck icon">

  <!-- Truck body -->
  <path d="M5 19h24v17H5z"
        fill="#D62828"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Cab -->
  <path d="M29 22h8l6 7v7H29z"
        fill="#E53935"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Cab window -->
  <path d="M32 24h4l4 5h-8z"
        fill="#B3E5FC"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Equipment compartment doors -->
  <rect x="8" y="24" width="8" height="8" rx="1"
        fill="#C62828"
        stroke="#202020"
        stroke-width="1.5"/>

  <rect x="18" y="24" width="8" height="8" rx="1"
        fill="#C62828"
        stroke="#202020"
        stroke-width="1.5"/>

  <path d="M10 27h4M10 30h4M20 27h4M20 30h4"
        stroke="#FFD43B"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Ladder -->
  <path d="M8 15h27"
        stroke="#CFD8DC"
        stroke-width="4"
        stroke-linecap="round"/>

  <path d="M10 12v6M16 12v6M22 12v6M28 12v6M34 12v6"
        stroke="#607D8B"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Emergency light -->
  <rect x="31" y="17" width="8" height="4" rx="1"
        fill="#1E88E5"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Hose reel -->
  <circle cx="24" cy="21" r="3"
          fill="#FFD43B"
          stroke="#202020"
          stroke-width="1.5"/>

  <circle cx="24" cy="21" r="1"
          fill="#202020"/>

  <!-- Front grille and light -->
  <rect x="40" y="31" width="3" height="4" rx="1"
        fill="#607D8B"
        stroke="#202020"
        stroke-width="1"/>

  <circle cx="41" cy="29" r="1.5"
          fill="#FFF176"
          stroke="#202020"
          stroke-width="1"/>

  <!-- Wheels -->
  <circle cx="13" cy="37" r="5"
          fill="#263238"
          stroke="#202020"
          stroke-width="2"/>

  <circle cx="35" cy="37" r="5"
          fill="#263238"
          stroke="#202020"
          stroke-width="2"/>

  <circle cx="13" cy="37" r="2"
          fill="#90A4AE"/>

  <circle cx="35" cy="37" r="2"
          fill="#90A4AE"/>

  <!-- Bumpers -->
  <path d="M4 34h4M41 35h4"
        stroke="#607D8B"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

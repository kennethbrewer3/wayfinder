<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Tractor icon">

  <!-- Rear wheel -->
  <circle cx="14" cy="35" r="8"
          fill="#263238"
          stroke="#202020"
          stroke-width="2"/>

  <circle cx="14" cy="35" r="3"
          fill="#90A4AE"
          stroke="#202020"
          stroke-width="1.5"/>

  <!-- Front wheel -->
  <circle cx="36" cy="37" r="5"
          fill="#263238"
          stroke="#202020"
          stroke-width="2"/>

  <circle cx="36" cy="37" r="2"
          fill="#90A4AE"/>

  <!-- Tractor body -->
  <path d="M17 28h18l5 7H20z"
        fill="#D62828"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Engine hood -->
  <rect x="28" y="23" width="11" height="8" rx="1"
        fill="#E53935"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Cab -->
  <path d="M17 28V15h11l4 13z"
        fill="#C62828"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Cab window -->
  <path d="M20 18h6l2 8h-8z"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Exhaust -->
  <path d="M35 23V14"
        stroke="#455A64"
        stroke-width="3"
        stroke-linecap="round"/>

  <path d="M33 14h4"
        stroke="#202020"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Front grille -->
  <path d="M37 25v4"
        stroke="#202020"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Headlight -->
  <circle cx="39" cy="27" r="1.5"
          fill="#FFD43B"
          stroke="#202020"
          stroke-width="1"/>

</svg>

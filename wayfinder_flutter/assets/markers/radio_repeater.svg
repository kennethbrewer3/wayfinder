<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Ham radio repeater icon">

  <!-- Repeater cabinet -->
  <rect x="12" y="10" width="18" height="28" rx="2"
        fill="#455A64"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Display -->
  <rect x="15" y="14" width="12" height="6" rx="1"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Control knobs -->
  <circle cx="18" cy="26" r="2"
          fill="#FFD43B"
          stroke="#202020"
          stroke-width="1.5"/>

  <circle cx="24" cy="26" r="2"
          fill="#66BB6A"
          stroke="#202020"
          stroke-width="1.5"/>

  <!-- Speaker grille -->
  <path d="M16 32h10
           M16 35h10"
        fill="none"
        stroke="#90A4AE"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Antenna mast -->
  <path d="M34 39V12"
        stroke="#202020"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Antenna element -->
  <path d="M30 14h8
           M31 20h6"
        stroke="#607D8B"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <!-- Radio signal waves -->
  <path d="M38 16c4 3 4 8 0 11
           M41 12c7 6 7 14 0 20"
        fill="none"
        stroke="#1E88E5"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Repeater direction arrows -->
  <path d="M5 18h6
           M8 15l3 3-3 3"
        fill="none"
        stroke="#43A047"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <path d="M11 31H5
           M8 28l-3 3 3 3"
        fill="none"
        stroke="#D62828"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Base -->
  <path d="M9 40h29"
        stroke="#202020"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

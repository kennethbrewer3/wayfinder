<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Fuel icon">

  <!-- Fuel pump body -->
  <rect x="9" y="7" width="22" height="35" rx="3"
        fill="#D62828"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Pump display -->
  <rect x="13" y="11" width="14" height="10" rx="1"
        fill="#B3E5FC"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Fuel hose -->
  <path d="M31 14
           H35
           C39 14 41 17 41 21
           V34
           C41 37 39 39 36 39
           C33 39 31 37 31 34"
        fill="none"
        stroke="#202020"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Nozzle -->
  <path d="M36 12
           L42 16
           L39 21
           L35 18Z"
        fill="#607D8B"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Fuel drop -->
  <path d="M20 25
           C20 25 16 30 16 33
           C16 36 18 38 20 38
           C22 38 24 36 24 33
           C24 30 20 25 20 25Z"
        fill="#FFD43B"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Base -->
  <path d="M6 43h29"
        stroke="#202020"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

  <rect x="29" y="16" width="7" height="6" rx="1"
        fill="#B3E5FC"
        stroke="#202020"
        stroke-width="1.5"/>

  <rect x="12" y="25" width="7" height="6" rx="1"
        fill="#B3E5FC"
        stroke="#202020"
        stroke-width="1.5"/>

  <rect x="29" y="25" width="7" height="6" rx="1"
        fill="#B3E5FC"
        stroke="#202020"
        stroke-width="1.5"/>


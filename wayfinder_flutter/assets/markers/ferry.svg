<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Ferry icon">

  <!-- Ferry hull -->
  <path d="M6 31h36l-5 9H11z"
        fill="#1E88E5"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Main deck -->
  <rect x="10" y="21" width="28" height="10" rx="1"
        fill="#ECEFF1"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Upper cabin -->
  <rect x="16" y="12" width="16" height="9" rx="1"
        fill="#F5F5F5"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Cabin windows -->
  <rect x="18" y="14" width="5" height="4"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="1.2"/>

  <rect x="25" y="14" width="5" height="4"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="1.2"/>

  <!-- Vehicle deck openings -->
  <rect x="13" y="24" width="8" height="5"
        fill="#90A4AE"
        stroke="#202020"
        stroke-width="1.5"/>

  <rect x="27" y="24" width="8" height="5"
        fill="#90A4AE"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Mast and flag -->
  <path d="M24 12V6"
        stroke="#202020"
        stroke-width="2"
        stroke-linecap="round"/>

  <path d="M24 6l7 3-7 3z"
        fill="#D62828"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Water -->
  <path d="M4 42c4-3 8 3 12 0s8 3 12 0 8 3 16 0"
        fill="none"
        stroke="#29B6F6"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

        stroke="#202020"
        stroke-width="1.5"/>

  <rect x="32" y="24" width="6" height="6" rx="1"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Ground -->
  <path d="M5 44h38"

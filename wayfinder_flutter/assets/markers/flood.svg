<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Flood icon">

  <!-- House -->
  <path d="M14 28 L24 18 L34 28 V38 H14 Z"

graphhopper:
  # Overridden at runtime via -Ddw.graphhopper.datareader.file / graph.location
  datareader.file: ""
  graph.location: graph-cache

  # Required in GraphHopper 9.x (import refuses to start without this key).
  # Empty list keeps footways/cycleways for foot + bike profiles.
  import.osm.ignored_highways: []

  profiles:
    - name: car
      custom_model_files: [car.json]
    - name: foot
      custom_model_files: [foot.json]
    - name: bike
      custom_model_files: [bike.json]

  profiles_ch:
    - profile: car
    - profile: foot
    - profile: bike

  # Encoded values required by the built-in custom models above (GH 9.x lists
  # the full set when any are missing — keep this in sync with foot/bike/car).
  graph.encoded_values: car_access,car_average_speed,foot_access,foot_average_speed,bike_access,bike_average_speed,road_class,road_class_link,road_environment,max_speed,road_access,surface,hike_rating,foot_priority,bike_priority,roundabout

  prepare.min_network_size: 200
  prepare.subnetworks.threads: 1

  # Memory-map the graph from disk instead of loading it entirely into the Java
  # heap (RAM_STORE). Uses far less heap for large extracts (e.g. United States);
  # import and queries are slower. The graph is still written under graph.location.
  # After changing this, clear/rebuild graph-cache (Wayfinder rebuild already does).
  graph.dataaccess.default_type: MMAP

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 127.0.0.1
      max_request_header_size: 50k
  request_log:
    appenders: []
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 127.0.0.1

logging:
  appenders:
    - type: console
      time_zone: UTC
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

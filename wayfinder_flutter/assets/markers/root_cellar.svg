<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Root cellar icon">

  <!-- Earthen mound -->
  <path d="M4 39
           C7 27 14 18 24 16
           C34 18 41 27 44 39Z"
        fill="#6B7A46"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Cellar entrance -->
  <path d="M14 39
           V29
           C14 23 18 20 24 20
           C30 20 34 23 34 29
           V39Z"
        fill="#8D6E63"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Wooden door -->
  <rect x="19" y="27" width="10" height="12" rx="1"
        fill="#8D5A2B"
        stroke="#202020"
        stroke-width="2"/>

  <path d="M24 27v12
           M19 33h10"
        stroke="#5C3618"
        stroke-width="1.5"/>

  <!-- Door handle -->
  <circle cx="27" cy="34" r="1"
          fill="#FFD43B"/>

  <!-- Vent pipe -->
  <path d="M31 19V10h6v9"
        fill="#607D8B"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <path d="M30 10h8"
        stroke="#202020"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Stored root vegetables -->
  <path d="M9 36
           C9 33 11 31 13 31
           C15 31 17 33 17 36Z"
        fill="#E67E22"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <path d="M12 31l-2-3
           M13 31l2-3"
        stroke="#4CAF50"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <path d="M37 36
           C37 33 39 31 41 31
           C43 31 44 33 44 36Z"
        fill="#B85C38"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <path d="M40 31l-1-3
           M41 31l2-3"
        stroke="#4CAF50"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Ground -->
  <path d="M4 41h40"
        stroke="#4CAF50"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

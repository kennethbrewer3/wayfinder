<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Water cistern icon">

  <!-- Cistern tank -->
  <rect x="9" y="11" width="30" height="28" rx="5"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Tank bands -->
  <path d="M9 20h30M9 31h30"
        stroke="#1565C0"

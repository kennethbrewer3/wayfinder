        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Star -->
  <path d="M24 14
           L25.5 17
           L29 17.5
           L26.5 20
           L27 23.5
           L24 22
           L21 23.5
           L21.5 20
           L19 17.5
           L22.5 17Z"
        fill="#FFD43B"
        stroke="#202020"
        stroke-width="1.2"
        stroke-linejoin="round"/>

  <!-- Base building -->
  <rect x="15" y="32" width="18" height="7" rx="1"
        fill="#607D8B"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Hangar door -->
  <rect x="21" y="34" width="6" height="5"
        fill="#37474F"
        stroke="#202020"
        stroke-width="1.2"/>
</svg>

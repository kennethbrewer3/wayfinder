<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Cell tower icon">

  <!-- Tower mast -->
  <path d="M24 9L14 42H34Z"
        fill="#90A4AE"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Tower braces -->
  <path d="M19 22h10M17 29h14M15 36h18M20 18l8 18M28 18l-8 18"
        fill="none"
        stroke="#607D8B"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Antenna -->
  <path d="M24 9V4"
        stroke="#202020"
        stroke-width="3"
        stroke-linecap="round"/>

  <circle cx="24" cy="4" r="2"
          fill="#D62828"
          stroke="#202020"
          stroke-width="1.5"/>

  <!-- Side panels -->
  <rect x="10" y="14" width="5" height="12" rx="2"
        fill="#CFD8DC"
        stroke="#202020"
        stroke-width="2"/>

  <rect x="33" y="14" width="5" height="12" rx="2"
        fill="#CFD8DC"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Signal waves -->
  <path d="M9 9c-5 4-5 10 0 14M39 9c5 4 5 10 0 14"
        fill="none"
        stroke="#1E88E5"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <path d="M5 5c-8 7-8 18 0 25M43 5c8 7 8 18 0 25"
        fill="none"
        stroke="#64B5F6"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Base -->
  <path d="M10 43h28"
        stroke="#202020"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

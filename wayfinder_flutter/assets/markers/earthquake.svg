<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Earthquake icon">

  <!-- Building -->
  <rect x="16" y="14" width="16" height="22" rx="1"
        fill="#78909C"
        stroke="#202020"
        stroke-width="2"/>

  <rect x="19" y="18" width="4" height="4" fill="#ECEFF1" stroke="#202020" stroke-width="1"/>
  <rect x="25" y="18" width="4" height="4" fill="#ECEFF1" stroke="#202020" stroke-width="1"/>
  <rect x="19" y="26" width="4" height="4" fill="#ECEFF1" stroke="#202020" stroke-width="1"/>
  <rect x="25" y="26" width="4" height="4" fill="#ECEFF1" stroke="#202020" stroke-width="1"/>

  <!-- Cracked ground -->
  <path d="M4 38 H18 L22 42 H28 L32 38 H44"
        fill="none"
        stroke="#5D4037"
        stroke-width="3"
        stroke-linecap="round"

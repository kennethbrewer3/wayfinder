<?xml version="1.0" encoding="UTF-8"?>
<!--
  Wayfinder map marker pin (viewBox 0 0 44 x 44).

  Layout (read at runtime from element ids in this file):
    - Anchor tip: bottom center of the viewBox on the map coordinate
    - icon-background: circle center and radius for the icon slot
    - icon-placeholder-glyph: optional circle for glyph size (5% inset if omitted)

  Element ids:
    marker-head, marker-tail   Pin fill; tinted with marker color at runtime
    icon-background            Inner circle; drives icon slot size and position
    marker-outline             Head ring stroke; tinted with marker color at runtime
    icon-placeholder           Design reference only (hidden when rendered in the app)
    icon-placeholder-glyph     Optional; sets rendered glyph size when present

  Edit in Inkscape, Illustrator, etc. Resize or move icon-background to change
  where icons appear. Resize icon-placeholder-glyph to change icon glyph size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44">
  <circle id="marker-head" cx="22" cy="16" r="16" fill="#000000"/>
  <path id="marker-tail" fill="#000000"
        d="M 14.32 21.76 Q 17.776 36 22 44 Q 26.224 36 29.68 21.76 Z"/>
  <circle id="icon-background" cx="22" cy="16" r="11.84" fill="#FFFFFF"/>
  <circle id="marker-outline" cx="22" cy="16" r="16" fill="none" stroke="#000000" stroke-width="0.75"/>
  <g id="icon-placeholder" fill="none" stroke="#888888" stroke-width="0.75">
    <circle id="icon-placeholder-bg" cx="22" cy="16" r="11.84" stroke-dasharray="2 2"/>
    <circle id="icon-placeholder-glyph" cx="22" cy="16" r="10.656" stroke-dasharray="1.5 1.5" stroke="#AAAAAA"/>
    <path id="icon-placeholder-crosshair-h" d="M 14 16 H 30"/>
    <path id="icon-placeholder-crosshair-v" d="M 22 8 V 24"/>
    <text id="icon-placeholder-label" x="22" y="17.5" text-anchor="middle"
          font-family="sans-serif" font-size="5" fill="#888888" stroke="none">ICON</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Wind turbine icon">

  <!-- Tower -->
  <path d="M22 19h4l4 24H18z"
        fill="#B0BEC5"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Straight blades -->
  <path d="M24 17V3"
        stroke="#ECEFF1"
        stroke-width="5"
        stroke-linecap="round"/>

  <path d="M24 17L11 24"
        stroke="#ECEFF1"
        stroke-width="5"
        stroke-linecap="round"/>

  <path d="M24 17L37 24"
        stroke="#ECEFF1"
        stroke-width="5"
        stroke-linecap="round"/>

  <!-- Blade outlines -->
  <path d="M24 17V3
           M24 17L11 24
           M24 17L37 24"
        fill="none"
        stroke="#202020"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Hub -->
  <circle cx="24" cy="17" r="4"
          fill="#FFD43B"
          stroke="#202020"
          stroke-width="2"/>

  <!-- Ground -->
  <path d="M9 43h30"
        stroke="#4CAF50"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

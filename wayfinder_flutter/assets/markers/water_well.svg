<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Water well icon">

  <!-- Well base -->
  <path d="M9 27h30v14H9z"
        fill="#B0BEC5"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Stone blocks -->
  <path d="M9 32h30M18 27v5M30 27v5M14 32v9M25 32v9M35 32v9"
        fill="none"
        stroke="#78909C"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Roof posts -->
  <path d="M13 27V14M35 27V14"
        stroke="#8D5A2B"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Roof -->
  <path d="M7 15L24 5l17 10z"
        fill="#D62828"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Winch -->
  <path d="M15 20h18"
        stroke="#5C3618"
        stroke-width="3"
        stroke-linecap="round"/>

  <circle cx="24" cy="20" r="3"
          fill="#A66A2C"
          stroke="#202020"
          stroke-width="1.5"/>

  <!-- Rope -->
  <path d="M24 23v10"
        stroke="#6D4C41"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Bucket -->
  <path d="M20 33h8l-1 6h-6z"

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Hiking person icon">

  <!-- Head -->
  <circle cx="25" cy="8" r="4"
          fill="#F2B38A"
          stroke="#202020"
          stroke-width="2"/>

  <!-- Backpack -->
  <rect x="15" y="15" width="8" height="14" rx="3"
        fill="#D9772B"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Torso -->
  <path d="M22 14
           C25 13 29 14 31 17
           L30 28
           L22 28
           L19 20Z"
        fill="#4CAF50"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Front arm -->
  <path d="M29 18l7 7"
        fill="none"
        stroke="#F2B38A"
        stroke-width="4"
        stroke-linecap="round"/>

  <!-- Rear arm -->
  <path d="M21 18l-6 7"
        fill="none"
        stroke="#F2B38A"
        stroke-width="4"
        stroke-linecap="round"/>

  <!-- Hiking pole -->
  <path d="M37 22l-2 21"
        stroke="#6D4C41"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <!-- Front leg -->
  <path d="M27 28l8 12"
        fill="none"
        stroke="#37474F"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Rear leg -->
  <path d="M23 28l-4 8-8 5"
        fill="none"
        stroke="#37474F"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Boots -->
  <path d="M32 41h7M8 42h7"
        stroke="#202020"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

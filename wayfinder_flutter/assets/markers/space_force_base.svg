<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Space force base icon">

  <!-- Base shield -->
  <path d="M24 4
           L40 10
           V23
           C40 33 34 40 24 44
           C14 40 8 33 8 23
           V10Z"
        fill="#1B2A49"
        stroke="#202020"
        stroke-width="2"

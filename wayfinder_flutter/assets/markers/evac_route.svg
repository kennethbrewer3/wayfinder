<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Evacuation route icon">

  <!-- Route sign -->
  <rect x="5" y="7" width="38" height="34" rx="3"
        fill="#2E7D32"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Exit doorway -->
  <rect x="28" y="14" width="9" height="19" rx="1"
        fill="#FFFFFF"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Running person -->
  <circle cx="16" cy="17" r="3"
          fill="#FFFFFF"/>

  <path d="M17 21l5 4 4-5
           M21 25l-4 6
           M21 25l6 5
           M17 22l-5 4"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Direction arrow -->
  <path d="M10 35h17"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"/>

  <path d="M23 31l5 4-5 4"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Rest stop icon">

  <!-- Road -->
  <path d="M4 36h40"
        fill="#616161"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <path d="M24 36v6"
        stroke="#FFD43B"
        stroke-width="2"
        stroke-dasharray="3 3"/>

  <!-- Parking area -->
  <rect x="8" y="24" width="32" height="10" rx="1"
        fill="#B0BEC5"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Picnic table -->
  <path d="M14 18h12"
        stroke="#8D5A2B"
        stroke-width="3"
        stroke-linecap="round"/>
  <path d="M16 18v8M24 18v8"
        stroke="#5C3618"
        stroke-width="2.5"
        stroke-linecap="round"/>
  <path d="M14 22h12"
        stroke="#A66A2C"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Restroom building -->
  <rect x="30" y="12" width="10" height="12" rx="1"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="1.5"/>
  <path d="M33 15h4M33 18h4"
        stroke="#1565C0"
        stroke-width="1.2"
        stroke-linecap="round"/>

  <!-- Trees -->
  <circle cx="10" cy="14" r="4"
          fill="#66BB6A"
          stroke="#2E7D32"
          stroke-width="1.2"/>
  <path d="M10 18v4"
        stroke="#5C3618"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Sign -->
  <rect x="6" y="8" width="10" height="5" rx="1"
        fill="#4CAF50"
        stroke="#202020"
        stroke-width="1.2"/>
  <path d="M8 10.5h6"
        stroke="#FFFFFF"
        stroke-width="1"
        stroke-linecap="round"/>
</svg>

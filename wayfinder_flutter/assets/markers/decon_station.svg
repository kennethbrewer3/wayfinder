<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Decontamination station icon">

  <!-- Station frame -->
  <rect x="7" y="8" width="34" height="34" rx="3"
        fill="#E0F2F1"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Shower pipe -->
  <path d="M15 12h14
           C33 12 35 14 35 18v3"
        fill="none"
        stroke="#607D8B"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Shower head -->
  <path d="M31 20h8v4h-8z"
        fill="#90A4AE"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Water spray -->
  <path d="M33 26v4
           M36 26v5
           M39 26v4"
        fill="none"
        stroke="#1E88E5"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Person -->
  <circle cx="21" cy="18" r="3"
          fill="#F2B38A"
          stroke="#202020"
          stroke-width="1.5"/>

  <path d="M21 22v9
           M21 25l-5 5
           M21 25l5 5
           M21 31l-4 7
           M21 31l4 7"
        fill="none"
        stroke="#202020"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Decontamination symbol -->
  <circle cx="13" cy="13" r="5"
          fill="#FFD43B"
          stroke="#202020"
          stroke-width="1.5"/>

  <path d="M13 9v8M9 13h8"
        stroke="#202020"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Drain -->
  <rect x="15" y="39" width="18" height="3" rx="1"
        fill="#607D8B"
        stroke="#202020"
        stroke-width="1.5"/>

  <path d="M18 40.5h12"
        stroke="#B0BEC5"
        stroke-width="1.2"
        stroke-linecap="round"/>
</svg>

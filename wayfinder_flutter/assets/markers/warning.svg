<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Warning sign">

  <!-- Outer dark yellow border -->
  <path
    d="M24 3
       L45 42
       H3
       Z"
    fill="#E0A800"/>

  <!-- Inner black border -->
  <path
    d="M24 6
       L41.5 39
       H6.5
       Z"
    fill="#202020"/>

  <!-- Yellow face -->
  <path
    d="M24 8.8
       L38.8 36.5
       H9.2
       Z"
    fill="#FFD43B"/>

  <!-- Exclamation mark -->
  <path
    d="M24 17
       V27"
    fill="none"
    stroke="#202020"
    stroke-width="4"
    stroke-linecap="round"/>

  <!-- Dot -->
  <circle
    cx="24"
    cy="32.8"
    r="2.4"
    fill="#202020"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Grain silo icon">

  <!-- Silo body -->
  <rect x="12" y="14" width="24" height="28" rx="3"
        fill="#B0BEC5"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Domed roof -->
  <path d="M12 14
           C14 8 18 5 24 5
           C30 5 34 8 36 14Z"
        fill="#90A4AE"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Horizontal bands -->
  <path d="M12 22h24
           M12 31h24"
        fill="none"
        stroke="#78909C"
        stroke-width="2"/>

  <!-- Access door -->
  <rect x="20" y="33" width="8" height="9" rx="1"
        fill="#607D8B"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Grain symbol -->
  <path d="M24 18v11
           M24 21l-4-3
           M24 24l4-3
           M24 27l-4-3"
        fill="none"
        stroke="#D6A62A"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Top vent -->
  <path d="M24 5V2"
        stroke="#202020"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Ground -->
  <path d="M7 43h34"
        stroke="#4CAF50"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

  <!-- Mouth -->
  <path d="M24 33v3
           M24 36c-2 2-4 2-6 0
           M24 36c2 2 4 2 6 0"
        fill="none"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Tongue -->
  <path d="M21 37
           C21 41 23 43 24 43
           C26 43 27 41 27 37Z"
        fill="#F48FB1"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linejoin="round"/>
</svg>

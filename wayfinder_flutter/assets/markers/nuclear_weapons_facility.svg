<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Nuclear weapons facility icon">

  <!-- Secure facility building -->
  <rect x="7" y="18" width="34" height="24" rx="2"
        fill="#6B7280"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Reinforced roof -->
  <path d="M5 18L24 8l19 10Z"
        fill="#374151"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Secure blast door -->
  <rect x="18" y="28" width="12" height="14" rx="1"
        fill="#455A64"
        stroke="#202020"
        stroke-width="2"/>

  <circle cx="24" cy="35" r="4"
          fill="#90A4AE"
          stroke="#202020"
          stroke-width="1.5"/>

  <path d="M24 31v8M20 35h8"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Radiation warning sign -->
  <circle cx="24" cy="18" r="8"
          fill="#FFD43B"
          stroke="#202020"
          stroke-width="2"/>

  <circle cx="24" cy="18" r="1.6"
          fill="#202020"/>

  <path d="M24 16
           L21 11
           A6 6 0 0 1 27 11
           Z"
        fill="#202020"/>

  <path d="M26 19
           H32
           A6 6 0 0 1 29 24
           Z"
        fill="#202020"/>

  <path d="M22 19
           L19 24
           A6 6 0 0 1 16 19
           Z"
        fill="#202020"/>

  <!-- Security fence -->
  <path d="M4 38h12M32 38h12
           M6 34v10M11 34v10
           M37 34v10M42 34v10"
        fill="none"
        stroke="#202020"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Ground -->
  <path d="M4 44h40"
        stroke="#4CAF50"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

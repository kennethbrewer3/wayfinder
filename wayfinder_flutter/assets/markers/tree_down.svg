<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Tree down icon">

  <!-- Fallen trunk -->
  <path d="M6 34 H38"
        stroke="#795548"
        stroke-width="6"
        stroke-linecap="round"/>

  <!-- Stump -->
  <rect x="6" y="30" width="6" height="8" rx="1"
        fill="#8D6E63"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Fallen canopy -->
  <ellipse cx="34" cy="28" rx="10" ry="7"
           fill="#2E7D32"
           stroke="#202020"
           stroke-width="2"
           transform="rotate(-15 34 28)"/>

  <!-- Broken branches -->
  <path d="M22 34 L18 28 M26 34 L30 26"
        stroke="#5D4037"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <!-- Debris -->
  <path d="M14 38 L16 36 M32 38 L34 36"
        stroke="#6D4C41"
        stroke-width="2"
        stroke-linecap="round"/>

  <path d="M4 42 H44"
        stroke="#4CAF50"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

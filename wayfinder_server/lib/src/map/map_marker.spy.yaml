class: MapMarker
table: map_marker
fields:
  id: UuidValue, defaultModel=random
  name: String
  notes: String?
  latitude: double
  longitude: double
  elevation: double, defaultModel=0, defaultPersist=0
  color: String
  icon: String
  visible: bool
  isTracking: bool, defaultModel=false, defaultPersist=false
  trackZoneId: UuidValue?
  weatherJson: String?
  inventoryJson: String?
  radioJson: String?
  ### Named checklists / SOPs with checkable items (JSON)
  checklistsJson: String?
  layerId: UuidValue?
  ### Auth user that created this marker (null for legacy / anonymous)
  createdByAuthUserId: UuidValue?
  ### Login id / display label at create time (survives user deletion)
  createdByUsername: String?
  ### Auth user that last edited this marker
  updatedByAuthUserId: UuidValue?
  ### Login id / display label at last edit
  updatedByUsername: String?
  ### Soft-delete timestamp; null means active
  deletedAt: DateTime?
  deletedByAuthUserId: UuidValue?
  deletedByUsername: String?
  createdAt: DateTime
  updatedAt: DateTime

indexes:
  map_marker_name_idx:
    fields: name
  map_marker_layer_id_idx:
    fields: layerId
  map_marker_deleted_at_idx:
    fields: deletedAt

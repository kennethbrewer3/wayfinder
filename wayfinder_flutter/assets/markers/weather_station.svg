<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Weather station icon">

  <!-- Instrument mast -->
  <path d="M24 12v31"
        stroke="#607D8B"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Cross arm -->
  <path d="M10 20h28"
        stroke="#607D8B"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Anemometer hub -->
  <circle cx="24" cy="11" r="3"
          fill="#FFD43B"
          stroke="#202020"
          stroke-width="2"/>

  <!-- Anemometer arms -->
  <path d="M24 11L15 7
           M24 11l8-6
           M24 11l2 10"
        fill="none"
        stroke="#202020"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Wind cups -->
  <path d="M10 5h7v5h-4
           C11 10 10 8 10 5Z"
        fill="#1E88E5"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <path d="M31 3h7v5h-4
           C32 8 31 6 31 3Z"
        fill="#1E88E5"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <path d="M24 20h6v7h-3
           C25 27 24 24 24 20Z"
        fill="#1E88E5"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Wind direction vane -->
  <path d="M10 20l7-5v10Z"
        fill="#D62828"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <path d="M38 20l-7-4v8Z"
        fill="#FFD43B"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Instrument box -->
  <rect x="17" y="27" width="14" height="10" rx="2"
        fill="#F5F5F5"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Thermometer -->
  <path d="M20 30v4"
        stroke="#E53935"
        stroke-width="2"
        stroke-linecap="round"/>

  <circle cx="20" cy="34" r="1.5"
          fill="#E53935"/>

  <!-- Rain indicator -->
  <path d="M26 30
           C26 30 24 32 24 34
           C24 35.5 25 36 26 36
           C27 36 28 35.5 28 34
           C28 32 26 30 26 30Z"
        fill="#1E88E5"/>

  <!-- Base -->
  <path d="M16 43h16"
        stroke="#202020"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Fuel depot icon">

  <!-- Storage tanks -->
  <rect x="6" y="14" width="15" height="24" rx="4"
        fill="#D62828"
        stroke="#202020"
        stroke-width="2"/>

  <rect x="27" y="10" width="15" height="28" rx="4"
        fill="#E53935"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Tank bands -->
  <path d="M6 22h15M6 31h15M27 19h15M27 29h15"
        stroke="#8B0000"
        stroke-width="2"/>

  <!-- Tank caps -->
  <path d="M11 14v-4h5v4M32 10V6h5v4"
        fill="#607D8B"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Connecting pipe -->
  <path d="M21 31h6v-8"
        fill="none"
        stroke="#607D8B"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Fuel drop symbol -->
  <path d="M34 17
           C34 17 30 22 30 25
           C30 28 32 30 34 30
           C36 30 38 28 38 25
           C38 22 34 17 34 17Z"
        fill="#FFD43B"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Safety fence -->
  <path d="M4 39h40M8 35v8M16 35v8M24 35v8M32 35v8M40 35v8"
        fill="none"
        stroke="#202020"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Ground -->
  <path d="M4 44h40"
        stroke="#607D8B"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

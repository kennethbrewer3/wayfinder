  <!-- Seismic waves -->
  <path d="M6 10 C10 14 10 18 6 22 M38 8 C34 12 34 16 38 20"
        fill="none" stroke="#FF6D00" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M4 42 H44"

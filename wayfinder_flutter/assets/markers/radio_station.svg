<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Radio station icon">

  <!-- Station building -->
  <rect x="7" y="22" width="24" height="20" rx="2"
        fill="#90A4AE"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Roof -->
  <path d="M5 22L19 12l14 10Z"
        fill="#455A64"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Door -->
  <rect x="15" y="31" width="8" height="11" rx="1"
        fill="#6D4C41"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Window -->
  <rect x="10" y="26" width="6" height="5"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Broadcast tower -->
  <path d="M36 40L40 14L44 40Z"
        fill="#B0BEC5"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Tower braces -->
  <path d="M38 29h4M37 35h6M38 24l4 11M42 24l-4 11"
        fill="none"
        stroke="#607D8B"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Antenna -->
  <path d="M40 14V8"
        stroke="#202020"
        stroke-width="3"
        stroke-linecap="round"/>

  <circle cx="40" cy="7" r="2"
          fill="#D62828"
          stroke="#202020"
          stroke-width="1.5"/>

  <!-- Radio waves -->
  <path d="M34 10c-4 3-4 8 0 11M46 10c4 3 4 8 0 11"
        fill="none"
        stroke="#1E88E5"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <path d="M30 6c-7 6-7 14 0 20M48 6c7 6 7 14 0 20"
        fill="none"
        stroke="#64B5F6"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Ground -->
  <path d="M4 43h40"
        stroke="#4CAF50"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

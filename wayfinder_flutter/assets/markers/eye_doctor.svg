  <rect x="11" y="25" width="7" height="6" rx="1"
        fill="#B3E5FC"
        stroke="#202020"
        stroke-width="1.5"/>

  <rect x="30" y="25" width="7" height="6" rx="1"
        fill="#B3E5FC"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Entrance -->
  <rect x="19" y="31" width="10" height="12" rx="1"
        fill="#90A4AE"
        stroke="#202020"
        stroke-width="2"/>

  <circle cx="26" cy="37" r="1"

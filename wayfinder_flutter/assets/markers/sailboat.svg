<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Sailboat icon">

  <!-- Mast -->
  <path d="M24 7v27"
        stroke="#202020"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <!-- Main sail -->
  <path d="M22 9
           L22 30
           L8 30Z"
        fill="#F5F5F5"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Forward sail -->
  <path d="M26 11
           L26 30
           L39 30Z"
        fill="#E53935"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Hull -->
  <path d="M7 31h34l-5 9H12z"
        fill="#1E88E5"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Deck -->
  <path d="M11 31h26"
        stroke="#8D5A2B"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Water -->
  <path d="M4 42
           c4-3 8 3 12 0
           s8 3 12 0
           s8 3 16 0"
        fill="none"
        stroke="#29B6F6"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Composting toilet icon">

  <!-- Toilet base -->
  <path d="M14 24
           C14 20 18 18 24 18
           C30 18 34 20 34 24
           V34
           C34 38 30 40 24 40
           C18 40 14 38 14 34Z"
        fill="#ECEFF1"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Bowl -->
  <ellipse cx="24" cy="30" rx="8" ry="5"
           fill="#CFD8DC"
           stroke="#202020"
           stroke-width="1.5"/>

  <!-- Tank -->
  <rect x="16" y="10" width="16" height="12" rx="2"
        fill="#B0BEC5"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Compost chamber -->
  <rect x="18" y="36" width="12" height="5" rx="1"
        fill="#6D4C41"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Leaf / eco symbol -->
  <path d="M24 12
           C20 12 18 15 18 18
           C18 21 20 23 24 24
           C28 23 30 21 30 18
           C30 15 28 12 24 12Z"
        fill="#66BB6A"
        stroke="#2E7D32"
        stroke-width="1.2"
        stroke-linejoin="round"/>

  <path d="M24 14v8M22 18h4"
        stroke="#1B5E20"
        stroke-width="1.2"
        stroke-linecap="round"/>

  <!-- Vent pipe -->
  <path d="M30 10v6"
        stroke="#607D8B"
        stroke-width="2.5"
        stroke-linecap="round"/>
</svg>

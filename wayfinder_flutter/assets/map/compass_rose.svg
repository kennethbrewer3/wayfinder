<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     width="64"
     height="64"
     role="img"
     aria-label="Compass rose">

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="27"
          fill="none"
          stroke="currentColor"
          stroke-width="2"/>

  <!-- Inner ring -->
  <circle cx="32" cy="32" r="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          opacity="0.6"/>

  <!-- Cardinal ticks -->
  <path d="M32 5 V11 M32 53 V59 M5 32 H11 M53 32 H59"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Intercardinal ticks -->
  <path d="M12 12 L16 16 M48 12 L44 16 M12 52 L16 48 M48 52 L44 48"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        opacity="0.5"/>

  <!-- North pointer -->
  <path d="M32 10 L37 30 L32 25 L27 30 Z"
        fill="currentColor"/>

  <!-- South pointer -->
  <path d="M32 54 L27 38 L32 42 L37 38 Z"
        fill="currentColor"
        opacity="0.45"/>

  <!-- East pointer -->
  <path d="M54 32 L38 27 L42 32 L38 37 Z"
        fill="currentColor"
        opacity="0.45"/>

  <!-- West pointer -->
  <path d="M10 32 L26 37 L22 32 L26 27 Z"
        fill="currentColor"
        opacity="0.45"/>

  <!-- Center hub -->
  <circle cx="32" cy="32" r="3"
          fill="currentColor"/>
</svg>

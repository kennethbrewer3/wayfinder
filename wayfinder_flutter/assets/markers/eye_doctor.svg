<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Eye doctor office icon">

  <!-- Building -->
  <rect x="7" y="17" width="34" height="26" rx="2"
        fill="#F5F5F5"
        stroke="#202020"

        stroke="#202020"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Water drop -->
  <path d="M24 34
           C24 34 22 37 22 38.5
           C22 40 23 41 24 41
           C25 41 26 40 26 38.5
           C26 37 24 34 24 34Z"
        fill="#1E88E5"/>

  <!-- Ground -->
  <path d="M6 43h36"
        stroke="#4CAF50"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

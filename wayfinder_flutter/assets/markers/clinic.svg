<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Clinic icon">

  <!-- Clinic building -->
  <rect x="7" y="15" width="34" height="28" rx="2"
        fill="#F5F5F5"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Roof -->
  <path d="M5 15L24 6l19 9Z"
        fill="#1E88E5"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Entrance -->
  <rect x="19" y="30" width="10" height="13" rx="1"
        fill="#90A4AE"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Windows -->
  <rect x="11" y="22" width="7" height="6" rx="1"
        fill="#B3E5FC"
        stroke="#202020"
        stroke-width="1.5"/>

  <rect x="30" y="22" width="7" height="6" rx="1"
        fill="#B3E5FC"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Medical cross -->
  <rect x="22" y="10" width="4" height="12"
        fill="#D62828"/>

  <rect x="18" y="14" width="12" height="4"
        fill="#D62828"/>

  <!-- Door handle -->
  <circle cx="26" cy="36" r="1"
          fill="#FFD43B"/>

  <!-- Ground -->
  <path d="M5 44h38"
        stroke="#4CAF50"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Public restroom icon">

  <!-- Building -->
  <rect x="8" y="10" width="32" height="32" rx="2"
        fill="#E3F2FD"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Door -->
  <rect x="18" y="22" width="12" height="20" rx="1"
        fill="#BBDEFB"
        stroke="#202020"
        stroke-width="2"/>

  <circle cx="27" cy="32" r="1.5" fill="#202020"/>

  <!-- Restroom sign -->
  <rect x="12" y="13" width="24" height="7" rx="1"
        fill="#1565C0"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Female figure -->
  <circle cx="17" cy="15.5" r="1.5" fill="#FFFFFF"/>
  <path d="M17 17.5v2.5M15 19.5h4"
        stroke="#FFFFFF"
        stroke-width="1.2"
        stroke-linecap="round"/>

  <!-- Male figure -->
  <circle cx="31" cy="15.5" r="1.5" fill="#FFFFFF"/>
  <path d="M31 17.5v2.5M29 19.5h4"
        stroke="#FFFFFF"
        stroke-width="1.2"
        stroke-linecap="round"/>

  <!-- Divider -->
  <path d="M24 13v7"
        stroke="#FFFFFF"
        stroke-width="1.2"/>

  <!-- Accessible ramp hint -->
  <path d="M10 42h28"
        stroke="#4CAF50"
        stroke-width="2.5"
        stroke-linecap="round"/>
</svg>

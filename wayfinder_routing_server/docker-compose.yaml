# Wayfinder routing server stack (GraphHopper + REST API).
#
# Pull pre-built image (default):
#   cp .env.example .env
#   docker compose pull && docker compose up -d
#
# Build from source (developers, from this directory):
#   docker compose up -d --build
#
# End users without a git clone: use ../deploy/routing-server/ — see ../DEPLOY.md

name: wayfinder-routing-server

services:
  server:
    build:
      context: ..
      dockerfile: wayfinder_routing_server/Dockerfile
    image: ${WAYFINDER_ROUTING_SERVER_IMAGE:-ghcr.io/kennethbrewer3/wayfinder-routing-server:latest}
    container_name: wayfinder-routing-server
    ports:
      - "${WAYFINDER_ROUTING_SERVER_PORT:-18382}:18382"
    environment:
      PORT: "18382"
      DATA_DIR: /data
      JAVA_XMX: "${JAVA_XMX:-2g}"
      GRAPHHOPPER_URL: http://127.0.0.1:8989
      GRAPHHOPPER_JAR: /app/graphhopper-web.jar
      GRAPHHOPPER_CONFIG: /app/config/config.yml
    volumes:
      - ${WAYFINDER_ROUTING_DATA_PATH:-./storage/data}:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:18382/api/health >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

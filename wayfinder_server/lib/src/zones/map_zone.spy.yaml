class: MapZone
table: map_zone
fields:
  id: UuidValue, defaultModel=random
  name: String
  type: String
  color: String
  borderColor: String
  borderPattern: String
  fillColor: String
  visible: bool
  geometryJson: String
  layerId: UuidValue?
  ### Auth user that created this zone (null for legacy / anonymous)
  createdByAuthUserId: UuidValue?
  ### Login id / display label at create time (survives user deletion)
  createdByUsername: String?
  ### Auth user that last edited this zone
  updatedByAuthUserId: UuidValue?
  ### Login id / display label at last edit
  updatedByUsername: String?
  ### Soft-delete timestamp; null means active
  deletedAt: DateTime?
  deletedByAuthUserId: UuidValue?
  deletedByUsername: String?
  createdAt: DateTime
  updatedAt: DateTime

indexes:
  map_zone_name_idx:
    fields: name
  map_zone_type_idx:
    fields: type
  map_zone_layer_id_idx:
    fields: layerId
  map_zone_deleted_at_idx:
    fields: deletedAt

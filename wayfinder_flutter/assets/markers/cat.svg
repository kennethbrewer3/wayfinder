<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Tuxedo cat face icon">

  <!-- Ears -->
  <path d="M10 16L13 6L20 13Z"
        fill="#202020"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <path d="M38 16L35 6L28 13Z"
        fill="#202020"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Face -->
  <path d="M12 17
           C14 11 19 8 24 8
           C29 8 34 11 36 17
           V29
           C36 37 31 42 24 42
           C17 42 12 37 12 29Z"
        fill="#202020"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- White tuxedo face marking -->
  <path d="M24 11
           C20 14 18 18 18 23
           C18 29 20 34 24 39
           C28 34 30 29 30 23
           C30 18 28 14 24 11Z"
        fill="#FFFFFF"/>

  <!-- White cheeks -->
  <circle cx="18" cy="29" r="6" fill="#FFFFFF"/>
  <circle cx="30" cy="29" r="6" fill="#FFFFFF"/>

  <!-- Eyes -->
  <ellipse cx="18" cy="22" rx="2.5" ry="3"
           fill="#7CB342"
           stroke="#202020"
           stroke-width="1.5"/>

  <ellipse cx="30" cy="22" rx="2.5" ry="3"
           fill="#7CB342"
           stroke="#202020"
           stroke-width="1.5"/>

  <circle cx="18" cy="22" r="1" fill="#202020"/>
  <circle cx="30" cy="22" r="1" fill="#202020"/>

  <!-- Pink nose -->
  <path d="M21 28
           Q24 26 27 28
           Q24 32 21 28Z"
        fill="#F48FB1"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Mouth -->
  <path d="M24 31v3
           M24 34c-2 2-4 2-5 0
           M24 34c2 2 4 2 5 0"
        fill="none"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Whiskers -->
  <path d="M17 31L7 28
           M17 34L6 34
           M31 31L41 28
           M31 34L42 34"
        fill="none"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linecap="round"/>
</svg>

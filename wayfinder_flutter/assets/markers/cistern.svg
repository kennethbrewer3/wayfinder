  <!-- Outlet pipe -->
  <path d="M39 29h4v8h-5"
        fill="none"
        stroke="#607D8B"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Base -->
  <path d="M13 39v4M35 39v4M10 43h28"
        fill="none"

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Side view ambulance icon">

  <!-- Ambulance body -->
  <path d="M5 17
           H31
           C35 17 38 19 40 22
           L44 28
           V36
           H5Z"
        fill="#F5F5F5"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Front cab -->
  <path d="M31 20
           H36
           C38 20 39 21 40 23
           L43 28
           H31Z"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Side window -->
  <rect x="33" y="22" width="5" height="6" rx="1"
        fill="#B3E5FC"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Rear medical compartment window -->
  <rect x="9" y="21" width="8" height="7" rx="1"
        fill="#B3E5FC"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Red medical stripe -->
  <path d="M6 30h37"
        stroke="#D62828"
        stroke-width="3"/>

  <!-- Medical cross -->
  <rect x="20" y="20" width="4" height="10"
        fill="#D62828"/>

  <rect x="17" y="23" width="10" height="4"
        fill="#D62828"/>

  <!-- Rear door -->
  <path d="M18 18v18"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Emergency light bar -->
  <rect x="18" y="12" width="12" height="5" rx="1"
        fill="#1E88E5"
        stroke="#202020"
        stroke-width="2"/>

  <rect x="24" y="12" width="6" height="5" rx="1"
        fill="#D62828"/>

  <!-- Headlight -->
  <rect x="42" y="30" width="2" height="3" rx="1"
        fill="#FFD43B"
        stroke="#202020"
        stroke-width="1"/>

  <!-- Wheels -->
  <circle cx="14" cy="37" r="5"
          fill="#263238"
          stroke="#202020"
          stroke-width="2"/>

  <circle cx="37" cy="37" r="5"
          fill="#263238"
          stroke="#202020"
          stroke-width="2"/>

  <circle cx="14" cy="37" r="2"
          fill="#90A4AE"/>

  <circle cx="37" cy="37" r="2"
          fill="#90A4AE"/>

  <!-- Bumpers -->
  <path d="M4 34h4M41 34h4"
        stroke="#607D8B"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

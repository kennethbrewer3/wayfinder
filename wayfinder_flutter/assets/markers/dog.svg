<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Dog face icon">

  <!-- Ears -->
  <path d="M13 14
           C8 10 5 12 6 18
           C7 24 10 28 15 29Z"
        fill="#8D5A2B"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <path d="M35 14
           C40 10 43 12 42 18
           C41 24 38 28 33 29Z"
        fill="#8D5A2B"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Head -->
  <path d="M12 18
           C14 10 19 7 24 7
           C29 7 34 10 36 18
           V29
           C36 37 31 42 24 42
           C17 42 12 37 12 29Z"
        fill="#C98A50"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Face patch -->
  <path d="M24 9
           C20 13 19 18 20 24
           H28
           C29 18 28 13 24 9Z"
        fill="#F2D2A9"/>

  <!-- Eyes -->
  <circle cx="18" cy="22" r="2.2"
          fill="#202020"/>

  <circle cx="30" cy="22" r="2.2"
          fill="#202020"/>

  <!-- Muzzle -->
  <ellipse cx="24" cy="31" rx="9" ry="7"
           fill="#F2D2A9"
           stroke="#202020"
           stroke-width="1.5"/>

  <!-- Nose -->
  <path d="M20 28
           Q24 25 28 28
           Q27 32 24 33
           Q21 32 20 28Z"
        fill="#202020"
        stroke="#202020"

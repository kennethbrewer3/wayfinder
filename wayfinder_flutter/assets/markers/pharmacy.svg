<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Pharmacy icon">

  <!-- Pharmacy building -->
  <rect x="7" y="16" width="34" height="27" rx="2"
        fill="#F5F5F5"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Roof -->
  <path d="M5 16L24 7l19 9Z"
        fill="#2E7D32"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Pharmacy sign -->
  <circle cx="24" cy="16" r="7"
          fill="#FFFFFF"
          stroke="#202020"
          stroke-width="2"/>

  <rect x="22" y="11" width="4" height="10"
        fill="#2E7D32"/>

  <rect x="19" y="14" width="10" height="4"
        fill="#2E7D32"/>

  <!-- Windows -->
  <rect x="11" y="24" width="7" height="6" rx="1"
        fill="#B3E5FC"
        stroke="#202020"
        stroke-width="1.5"/>

  <rect x="30" y="24" width="7" height="6" rx="1"
        fill="#B3E5FC"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Entrance -->
  <rect x="19" y="31" width="10" height="12" rx="1"
        fill="#90A4AE"
        stroke="#202020"
        stroke-width="2"/>

  <circle cx="26" cy="37" r="1"
          fill="#FFD43B"/>

  <!-- Ground -->
  <path d="M5 44h38"
        stroke="#4CAF50"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

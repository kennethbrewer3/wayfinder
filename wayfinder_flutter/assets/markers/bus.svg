<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Side view city bus icon">

  <!-- Bus body -->
  <path d="M5 14h33c3 0 5 2 5 5v17H5z"
        fill="#1E88E5"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Front windshield -->
  <path d="M35 18h5c2 0 3 1 3 3v6h-8z"
        fill="#B3E5FC"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Passenger windows -->
  <rect x="9" y="18" width="7" height="9" rx="1"
        fill="#B3E5FC"
        stroke="#202020"
        stroke-width="1.5"/>

  <rect x="18" y="18" width="7" height="9" rx="1"
        fill="#B3E5FC"
        stroke="#202020"
        stroke-width="1.5"/>

  <rect x="27" y="18" width="6" height="9" rx="1"
        fill="#B3E5FC"
        stroke="#202020"
        stroke-width="1.5"/>

  <!-- Passenger door -->
  <rect x="26" y="29" width="7" height="7" rx="1"
        fill="#ECEFF1"
        stroke="#202020"
        stroke-width="1.5"/>

  <path d="M29.5 29v7"
        stroke="#202020"
        stroke-width="1.3"/>

  <!-- Lower body stripe -->
  <path d="M6 30h37"
        stroke="#FFFFFF"
        stroke-width="2.5"/>

  <!-- Front light -->
  <rect x="40" y="30" width="3" height="4" rx="1"
        fill="#FFF176"
        stroke="#202020"
        stroke-width="1.2"/>

  <!-- Wheels -->
  <circle cx="14" cy="37" r="5"
          fill="#263238"
          stroke="#202020"
          stroke-width="2"/>

  <circle cx="36" cy="37" r="5"
          fill="#263238"
          stroke="#202020"
          stroke-width="2"/>

  <circle cx="14" cy="37" r="2"
          fill="#90A4AE"/>

  <circle cx="36" cy="37" r="2"
          fill="#90A4AE"/>

  <!-- Mirror -->
  <path d="M43 20h2v5h-2"
        fill="none"
        stroke="#202020"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>

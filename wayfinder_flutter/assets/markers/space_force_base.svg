  <!-- Orbit ring -->
  <ellipse cx="24" cy="21" rx="12" ry="6"
           fill="none"
           stroke="#90CAF9"
           stroke-width="2"
           transform="rotate(-20 24 21)"/>

  <!-- Delta symbol -->
  <path d="M24 9
           L32 30
           L24 26
           L16 30Z"

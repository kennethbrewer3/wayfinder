<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Nuclear power plant icon">

  <!-- Cooling towers -->
  <path d="M6 39
           C9 31 10 20 9 10

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 72 72"
     width="72"
     height="72"
     role="img"
     aria-label="Compass rose">

  <!-- Large outer ring; top band (y≈2–16) reserved for N / MN -->
  <circle cx="36" cy="36" r="34"
          fill="none"
          stroke="currentColor"
          stroke-width="2.25"/>

  <!-- Inner ring -->
  <circle cx="36" cy="36" r="16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          opacity="0.55"/>

  <!-- Cardinal ticks (below the label band) -->
  <path d="M36 16 V21 M36 51 V56 M16 36 H21 M51 36 H56"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Intercardinal ticks -->
  <path d="M20 20 L24 24 M52 20 L48 24 M20 52 L24 48 M52 52 L48 48"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        opacity="0.5"/>

  <!-- North pointer: tip starts below the N/MN label band -->
  <path d="M36 20 L42 36 L36 31 L30 36 Z"
        fill="currentColor"/>

  <!-- South pointer -->
  <path d="M36 52 L30 40 L36 44 L42 40 Z"
        fill="currentColor"
        opacity="0.45"/>

  <!-- East pointer -->
  <path d="M52 36 L40 30 L44 36 L40 42 Z"
        fill="currentColor"
        opacity="0.45"/>

  <!-- West pointer -->
  <path d="M20 36 L32 42 L28 36 L32 30 Z"
        fill="currentColor"
        opacity="0.45"/>

  <!-- Center hub -->
  <circle cx="36" cy="36" r="3.25"
          fill="currentColor"/>
</svg>

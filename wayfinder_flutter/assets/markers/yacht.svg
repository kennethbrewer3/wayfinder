<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Yacht icon">

  <!-- Upper cabin -->
  <path d="M17 19h15l6 7H14z"
        fill="#F5F5F5"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Cabin windows -->
  <path d="M20 21h5v4h-7z"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="1.4"
        stroke-linejoin="round"/>

  <path d="M27 21h4l4 4h-8z"
        fill="#90CAF9"
        stroke="#202020"
        stroke-width="1.4"
        stroke-linejoin="round"/>

  <!-- Main deck -->
  <path d="M9 27h32"
        stroke="#8D6E63"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Hull -->
  <path d="M5 28
           H43
           L38 39
           H13Z"
        fill="#1E88E5"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Hull accent -->
  <path d="M11 33h25"
        stroke="#FFFFFF"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <!-- Bow rail -->
  <path d="M35 19h6v8"
        fill="none"
        stroke="#202020"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Antenna -->
  <path d="M25 19v-7"
        stroke="#202020"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Water -->
  <path d="M4 42
           c4-3 8 3 12 0
           s8 3 12 0
           s8 3 16 0"
        fill="none"
        stroke="#29B6F6"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

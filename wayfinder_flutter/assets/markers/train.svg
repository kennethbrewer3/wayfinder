<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Train locomotive icon">

  <!-- Mirrored locomotive -->
  <g transform="translate(48 0) scale(-1 1)">

    <!-- Boiler -->
    <rect x="11" y="18" width="23" height="15" rx="4"
          fill="#D62828"
          stroke="#202020"
          stroke-width="2"/>

    <!-- Cab -->
    <rect x="28" y="12" width="12" height="21" rx="2"
          fill="#B71C1C"
          stroke="#202020"
          stroke-width="2"/>

    <!-- Cab window -->
    <rect x="31" y="16" width="6" height="6"
          fill="#90CAF9"
          stroke="#202020"
          stroke-width="1.5"/>

    <!-- Smokestack -->
    <path d="M15 18v-6h7v6"
          fill="#455A64"
          stroke="#202020"
          stroke-width="2"
          stroke-linejoin="round"/>

    <path d="M13 11h11"
          stroke="#202020"
          stroke-width="3"
          stroke-linecap="round"/>

    <!-- Cowcatcher -->
    <path d="M11 29L5 36h10z"
          fill="#607D8B"
          stroke="#202020"
          stroke-width="2"
          stroke-linejoin="round"/>

    <!-- Front lamp -->
    <circle cx="11" cy="23" r="2.5"
            fill="#FFD43B"
            stroke="#202020"
            stroke-width="1.5"/>

    <!-- Wheels -->
    <circle cx="17" cy="35" r="5"
            fill="#263238"
            stroke="#202020"
            stroke-width="2"/>

    <circle cx="29" cy="35" r="5"
            fill="#263238"
            stroke="#202020"
            stroke-width="2"/>

    <circle cx="38" cy="35" r="4"
            fill="#263238"
            stroke="#202020"
            stroke-width="2"/>

    <circle cx="17" cy="35" r="2" fill="#90A4AE"/>
    <circle cx="29" cy="35" r="2" fill="#90A4AE"/>
    <circle cx="38" cy="35" r="1.5" fill="#90A4AE"/>

    <!-- Connecting rod -->
    <path d="M17 35h21"
          stroke="#FFD43B"
          stroke-width="2"
          stroke-linecap="round"/>

  </g>

  <!-- Rail -->
  <path d="M5 42h38"
        stroke="#607D8B"
        stroke-width="3"
        stroke-linecap="round"/>

</svg>

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Bunker icon">

  <!-- Earthen cover -->
  <path d="M5 25
           C9 15 16 10 24 10
           C32 10 39 15 43 25
           Z"
        fill="#6B7A46"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Concrete bunker -->
  <path d="M8 24
           H40
           V41
           H8Z"
        fill="#78909C"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Reinforced roof -->
  <path d="M7 24h34"
        stroke="#455A64"
        stroke-width="4"
        stroke-linecap="round"/>

  <!-- Blast door -->
  <rect x="18" y="28" width="12" height="13" rx="1"
        fill="#455A64"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Door wheel -->
  <circle cx="24" cy="34.5" r="3.5"
          fill="#90A4AE"
          stroke="#202020"
          stroke-width="1.5"/>

  <path d="M24 31v7
           M20.5 34.5h7"
        stroke="#202020"
        stroke-width="1.5"
        stroke-linecap="round"/>

  <!-- Firing ports -->
  <rect x="11" y="29" width="5" height="3" rx="1"
        fill="#263238"
        stroke="#202020"
        stroke-width="1.2"/>

  <rect x="32" y="29" width="5" height="3" rx="1"
        fill="#263238"
        stroke="#202020"
        stroke-width="1.2"/>

  <!-- Ground -->
  <path d="M4 42h40"
        stroke="#4CAF50"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

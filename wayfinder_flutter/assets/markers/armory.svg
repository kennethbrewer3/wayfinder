<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Armory icon">

  <!-- Armory building -->
  <rect x="7" y="17" width="34" height="26" rx="2"
        fill="#6B7A46"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Reinforced roof -->
  <path d="M5 17L24 7l19 10Z"

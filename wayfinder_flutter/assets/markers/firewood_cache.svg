<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Firewood cache icon">

  <!-- Shelter roof -->
  <path d="M5 18L24 7l19 11Z"
        fill="#5D4037"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Shelter posts -->
  <path d="M9 18v24M39 18v24"
        stroke="#8D5A2B"
        stroke-width="4"
        stroke-linecap="round"/>

  <!-- Stacked logs -->
  <rect x="11" y="22" width="26" height="7" rx="3"
        fill="#A66A2C"
        stroke="#202020"
        stroke-width="2"/>

  <rect x="8" y="29" width="27" height="7" rx="3"
        fill="#C47A32"
        stroke="#202020"
        stroke-width="2"/>

  <rect x="13" y="36" width="27" height="7" rx="3"
        fill="#A66A2C"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Cut log ends -->
  <circle cx="11" cy="32.5" r="3.5"
          fill="#E0A96D"
          stroke="#202020"
          stroke-width="1.5"/>

  <circle cx="37" cy="25.5" r="3.5"
          fill="#E0A96D"
          stroke="#202020"
          stroke-width="1.5"/>

  <circle cx="40" cy="39.5" r="3.5"
          fill="#E0A96D"
          stroke="#202020"
          stroke-width="1.5"/>

  <!-- Growth rings -->
  <circle cx="11" cy="32.5" r="1.3"
          fill="none"
          stroke="#8D5A2B"
          stroke-width="1"/>

  <circle cx="37" cy="25.5" r="1.3"
          fill="none"
          stroke="#8D5A2B"
          stroke-width="1"/>

  <circle cx="40" cy="39.5" r="1.3"
          fill="none"
          stroke="#8D5A2B"
          stroke-width="1"/>

  <!-- Ground -->
  <path d="M5 44h38"
        stroke="#4CAF50"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Motorcycle icon">

  <!-- Wheels -->
  <circle cx="12" cy="35" r="7"
          fill="#263238"
          stroke="#202020"
          stroke-width="2"/>

  <circle cx="36" cy="35" r="7"
          fill="#263238"
          stroke="#202020"
          stroke-width="2"/>

  <circle cx="12" cy="35" r="3"
          fill="#90A4AE"
          stroke="#202020"
          stroke-width="1.5"/>

  <circle cx="36" cy="35" r="3"
          fill="#90A4AE"
          stroke="#202020"
          stroke-width="1.5"/>

  <!-- Motorcycle frame -->
  <path d="M12 35
           L19 24
           H28
           L36 35
           H23
           L17 29"
        fill="none"
        stroke="#202020"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Fuel tank -->
  <path d="M20 23
           C22 19 28 19 31 22
           L28 27
           H19Z"
        fill="#E53935"
        stroke="#202020"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- Seat -->
  <path d="M15 22h8"
        stroke="#37474F"
        stroke-width="4"
        stroke-linecap="round"/>

  <!-- Front fork -->
  <path d="M30 21l6 14"
        stroke="#607D8B"
        stroke-width="3"
        stroke-linecap="round"/>

  <!-- Handlebars -->
  <path d="M29 21l4-5h5"
        fill="none"
        stroke="#202020"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Headlight -->
  <circle cx="34" cy="20" r="2.5"
          fill="#FFD43B"
          stroke="#202020"
          stroke-width="1.5"/>

  <!-- Engine -->
  <circle cx="23" cy="31" r="4"
          fill="#78909C"
          stroke="#202020"
          stroke-width="2"/>

  <!-- Exhaust -->
  <path d="M23 34h10"
        stroke="#607D8B"
        stroke-width="3"
        stroke-linecap="round"/>
</svg>

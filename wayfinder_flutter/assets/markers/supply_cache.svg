<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48"
     height="48"
     role="img"
     aria-label="Supply cache icon">

  <!-- Supply crate -->
  <rect x="6" y="15" width="36" height="27" rx="2"
        fill="#C98A50"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Crate lid -->
  <rect x="6" y="12" width="36" height="8" rx="2"
        fill="#A66A2C"
        stroke="#202020"
        stroke-width="2"/>

  <!-- Carry handle -->
  <path d="M18 12V8h12v4"
        fill="none"
        stroke="#202020"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Crate braces -->
  <path d="M8 21l32 18
           M40 21L8 39"
        fill="none"
        stroke="#6D4C41"
        stroke-width="2"
        stroke-linecap="round"/>

  <!-- Supply label -->
  <rect x="16" y="23" width="16" height="11" rx="2"
        fill="#F5F5F5"
        stroke="#202020"
        stroke-width="2"/>

  <!-- General supplies symbol -->
  <path d="M24 25v7
           M20.5 28.5h7"
        stroke="#2E7D32"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <!-- Latches -->
  <rect x="10" y="17" width="5" height="5" rx="1"
        fill="#607D8B"
        stroke="#202020"
        stroke-width="1.5"/>

  <rect x="33" y="17" width="5" height="5" rx="1"
        fill="#607D8B"
        stroke="#202020"
        stroke-width="1.5"/>
</svg>
